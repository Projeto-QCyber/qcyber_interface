<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">



  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ARMTEC - QCyber</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>

  <style>
    /* Estilo para a splash screen */
    #splash {
      position: fixed;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1s ease-out;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      position: absolute;
      max-width: 80%;
      max-height: 80%;
      transition: opacity 1s ease-in-out;
      opacity: 0;
    }
    #image1 {
      opacity: 1;
    }
  </style>
</head>
<body>
<div id="splash">
  <img id="image1" src="assets/images/lesc.png" alt="Splash Image 1">
  <img id="image2" src="assets/images/deti.png" alt="Splash Image 2">
  <img id="image3" src="assets/images/ufc.png" alt="Splash Image 3">
  <img id="image4" src="assets/images/biomedical.png" alt="Splash Image 4">
</div>
<script>
  window.addEventListener('load', function(ev) {
    // Download main.dart.js
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      }
    }).then(function(engineInitializer) {
      return engineInitializer.initializeEngine();
    }).then(function(appRunner) {
      return appRunner.runApp();
    }).finally(function() {
      // Suavizar a transição ao remover a splash screen
      const splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 1000); // Remover o elemento após a transição
    });
  });

  // Função para alternar entre as imagens
  function toggleImages() {
    const images = [
      document.getElementById('image1'),
      document.getElementById('image2'),
      document.getElementById('image3'),
      document.getElementById('image4')
    ];
    let currentIndex = 0;

    setInterval(() => {
      images[currentIndex].style.opacity = '0';
      currentIndex = (currentIndex + 1) % images.length;
      images[currentIndex].style.opacity = '1';
    }, 1000); // Alternar a cada 2 segundos
  }

  document.addEventListener('DOMContentLoaded', (event) => {
    toggleImages();
  });
</script>
</body>
</html>
